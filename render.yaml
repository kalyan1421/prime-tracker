services:
  - type: web
    name: prime-tracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .           # MUST be repo root so pnpm workspace + lockfile are visible

    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @prime-tracker/shared build && pnpm --filter @prime-tracker/api build && DIRECT_URL=${DIRECT_URL:-$DATABASE_URL} pnpm --filter @prime-tracker/api exec prisma migrate deploy

    startCommand: node apps/api/dist/main

    healthCheckPath: /api/health   # uses the no-auth liveness probe

    autoDeploy: true               # redeploy on every push to main

    envVars:
      - key: NODE_ENV
        value: production
      # ── Set these in the Render dashboard (not here) ──────────────────────
      - key: DATABASE_URL          # Supabase pooler  (port 6543)
        sync: false
      - key: DIRECT_URL            # Supabase direct  (port 5432, migrations only)
        sync: false
      - key: JWT_ACCESS_SECRET     # openssl rand -hex 64
        sync: false
      - key: JWT_REFRESH_SECRET    # openssl rand -hex 64
        sync: false
      - key: ENCRYPTION_KEY        # openssl rand -hex 32
        sync: false
      - key: FRONTEND_URL
        value: https://prime-tracker-web.onrender.com
      - key: CORS_ORIGINS
        value: https://prime-tracker-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL   # https://<render-url>/api/auth/google/callback
        sync: false
      - key: GOOGLE_ALLOWED_DOMAIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL             # auto-set by Render Redis — link in dashboard
        fromService:
          name: prime-tracker-redis
          type: redis
          property: connectionString
      - key: DEMO_MODE
        value: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

  - type: redis
    name: prime-tracker-redis
    plan: free           # 25 MB — enough for BullMQ queues; upgrade if queue grows
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ── Frontend (React + Vite static site) ─────────────────────────────────────
  - type: static
    name: prime-tracker-web
    region: singapore
    rootDir: .           # repo root — same as API so pnpm workspace is visible
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @prime-tracker/shared build &&
      pnpm --filter @prime-tracker/web build
    staticPublishPath: apps/web/dist
    autoDeploy: true     # redeploy on every push to main

    envVars:
      - key: VITE_API_BASE_URL
        value: https://prime-tracker-api.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://dxkqrwxixjyzxhtxdkht.supabase.co

    headers:
      # Cache hashed Vite asset chunks for 1 year (filename changes on every build)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Security headers on all responses
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      # SPA fallback — every non-file URL returns index.html so React Router works
      - type: rewrite
        source: /*
        destination: /index.html
