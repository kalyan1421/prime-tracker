name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always runs (push + PR). Catches build/type/schema/behaviour breakage. ──
  #
  # A real Postgres runs alongside, for two reasons: `prisma migrate deploy` proves the
  # hand-written migrations actually apply in order on an empty database, and the
  # integration suite asserts the DB-level constraints (GiST exclusion, CHECKs, FK
  # actions) that no amount of mocked Prisma can reach.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        # Without the healthcheck the first migrate races the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @prime-tracker/api exec prisma validate

      # Before the build: `prebuild` runs `prisma generate`, and the unit suite imports
      # the generated client for its enums.
      - name: Build shared package
        run: pnpm --filter @prime-tracker/shared run build
      - name: Generate Prisma client
        run: pnpm --filter @prime-tracker/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @prime-tracker/api exec prisma migrate deploy

      # 1400+ cases, no database, seconds to run. This is the suite that has to stay green.
      - name: API unit tests
        run: pnpm --filter @prime-tracker/api run test

      # GitHub Actions sets CI=true, which the integration suite reads: with CI set it
      # ASSERTS the database was reachable instead of skipping quietly. A suite that
      # skips itself and reports green is worse than no suite.
      - name: API integration tests (real Postgres)
        run: pnpm --filter @prime-tracker/api run test:integration

      # Component + derivation tests (vitest/jsdom). Playwright E2E is NOT here: it needs
      # both servers and a seeded database, so it belongs in its own job rather than
      # making every PR wait on a browser download.
      - name: Web component tests
        run: pnpm --filter @prime-tracker/web run test

      - name: Build API
        run: pnpm --filter @prime-tracker/api run build
      - name: Build web
        run: pnpm --filter @prime-tracker/web run build

  # ── Deploys the API + SPA to EC2 over SSM. Arms when DEPLOY_ENABLED=true. ───
  #
  # No port 22, and no AWS keys stored in GitHub.
  #
  # The previous version used scp + ssh, which could never have worked: security.tf
  # allows 22 from ONE address (var.admin_cidr, a home IP), and hosted runners get a
  # different IP every run — the job would have hung at the copy step and timed out
  # whatever secrets were set. Opening 22 to GitHub's published ranges would mean
  # thousands of addresses, re-published without notice, on the port that grants a shell.
  #
  # So the runner never connects to the box. It uploads the build to S3 and asks SSM to
  # run a document; the agent already on the instance pulls the artifact and releases it,
  # reaching OUT to AWS rather than being reached. Credentials are OIDC — a short-lived
  # token minted per run, scoped in IAM to this repo's main branch — so there is no
  # long-lived key to leak.
  #
  # Required, all created by infra/terraform/github-deploy.tf (enable_github_deploy=true):
  #   secret  AWS_DEPLOY_ROLE     role ARN the runner assumes
  #   secret  EC2_INSTANCE_ID     i-… of the API host
  #   var     DEPLOY_ENABLED      "true"
  #   var     AWS_REGION          e.g. us-east-1        (optional, defaults below)
  #   var     SSM_DEPLOY_DOCUMENT e.g. prime-tracker-deploy (optional, defaults below)
  #   var     APP_BUCKET          prime-tracker-app-<account-id>
  deploy:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # `id-token: write` is what lets the runner mint the OIDC token. Without it the
      # AWS credentials step fails with a confusing "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity". `contents: read` is still needed for checkout.
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SSM_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT || 'prime-tracker-deploy' }}
    steps:
      # The target cannot compile this application: on a t3.micro (914 MiB) `nest build`
      # dies with a V8 heap OOM (SIGABRT, exit 134) — measured, not guessed — and raising
      # --max-old-space-size only trades the crash for swap-thrashing a host that is also
      # serving live traffic. The runner has the memory; the box only installs runtime
      # deps, migrates and restarts.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared, API and web
        # VITE_API_BASE_URL is intentionally empty in apps/web/.env.production: the client
        # resolves to a same-origin /api, which nginx proxies to :3001 on the same box.
        # Setting it to an absolute URL would break that and require CORS.
        run: |
          pnpm --filter @prime-tracker/shared build
          pnpm --filter @prime-tracker/api run build
          pnpm --filter @prime-tracker/web run build

      - name: Pack build output
        run: tar czf dist.tgz packages/shared/dist apps/api/dist apps/web/dist

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Upload the artifact
        id: upload
        run: |
          set -euo pipefail
          # Keyed by commit, so a redeploy of the same SHA is idempotent and the object
          # name says exactly what is in it.
          KEY="releases/${GITHUB_SHA}.tgz"
          aws s3 cp dist.tgz "s3://${{ vars.APP_BUCKET }}/${KEY}"
          echo "url=s3://${{ vars.APP_BUCKET }}/${KEY}" >> "$GITHUB_OUTPUT"

      - name: Release via SSM
        id: ssm
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters ArtifactUrl="${{ steps.upload.outputs.url }}",GitSha="${GITHUB_SHA}" \
            --comment "GH run ${GITHUB_RUN_ID}" \
            --query Command.CommandId --output text)
          echo "Command: $CMD"
          echo "id=$CMD" >> "$GITHUB_OUTPUT"

          # send-command returns as soon as the command is ACCEPTED. Without waiting the
          # job goes green on a deploy that has not run yet, let alone succeeded.
          for i in $(seq 1 100); do
            sleep 6
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success) echo "done=success" >> "$GITHUB_OUTPUT"; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::SSM deploy finished as $STATUS"
                echo "done=$STATUS" >> "$GITHUB_OUTPUT"
                exit 1 ;;
            esac
          done
          echo "::error::SSM deploy still running after 10 minutes"
          exit 1

      # Runs even on failure — the box's output is the only way to see WHY a deploy
      # failed, and a red job with no log is a red job nobody can act on.
      - name: Deploy log
        if: always() && steps.ssm.outputs.id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text || true
          echo "── stderr ──"
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' --output text || true
